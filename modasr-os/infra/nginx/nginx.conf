events { worker_connections 2048; }
http {
  server_tokens off;
  client_max_body_size 8m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  server { listen 80 default_server; return 301 https://$host$request_uri; }

  server { listen 443 ssl; http2 on; server_name modasrhub.com www.modasrhub.com;
    location / { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; } }

  server { listen 443 ssl; http2 on; server_name api.modasrhub.com;
    location /metrics { deny all; }
    location /internal { deny all; }
    location /api/auth/ { limit_req zone=auth burst=10 nodelay; proxy_pass http://api:8000; proxy_set_header X-Forwarded-For $remote_addr; }
    location /tg/webhook { proxy_pass http://bot:8081; }   # secret_token validated by aiogram
    location / { limit_req zone=api burst=40 nodelay; proxy_pass http://api:8000; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; } }

  server { listen 443 ssl; http2 on; server_name n8n.modasrhub.com;
    location / { proxy_pass http://n8n:5678; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; } }
}
